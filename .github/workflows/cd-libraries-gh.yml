name: cd-libraries-gh

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag) to publish from"
        required: false
        default: ""
  push:
    branches:
      - master

jobs:
  release-github-packages:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'chore(release)')"

    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: wrappers/wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Setup stable Rust toolchain
        uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # pin@v1.0.6
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        env:
          RUSTFLAGS: "-Awarnings"
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pkg set name="@mattrinternal/pairing-crypto"

          npm config set //npm.pkg.github.com/:_authToken "${GH_TOKEN}"
          npm publish --registry https://npm.pkg.github.com || echo "Already published at this version, skipping"
