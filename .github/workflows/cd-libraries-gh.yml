name: cd-libraries-gh

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  release-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: wrappers/wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Setup nodejs for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mattrglobal"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm pkg set version="$(node -p "require('./package.json').version")-ghp-pilot.${{ github.run_number }}"
          npm publish --tag ghp-pilot
